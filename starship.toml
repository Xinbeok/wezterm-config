format = """
[](bg:#1a1b26 fg:#7aa2f7)\
$os\
$username\
[](bg:#292e42 fg:#1a1b26)\
$directory\
[](fg:#292e42 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$python\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
"""

[os]
style = "bg:#1a1b26 fg:#7aa2f7"
disabled = false

[username]
show_always = true
style_user = "bg:#1a1b26 fg:#7aa2f7"
style_root = "bg:#1a1b26 fg:#7aa2f7"
format = '[$user ]($style)'
disabled = false

[directory]
style = "bg:#292e42 fg:#bb9af7"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#394260 fg:#7dcfff"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#394260 fg:#7dcfff"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "bg:#212736 fg:#9ece6a"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#212736 fg:#9ece6a"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:#212736 fg:#9ece6a"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:#212736 fg:#9ece6a"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#1d2230 fg:#a9b1d6"
format = '[ $time ]($style)'
